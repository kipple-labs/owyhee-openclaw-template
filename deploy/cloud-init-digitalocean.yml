#cloud-config
# Owyhee-hardened OpenClaw — DigitalOcean droplet user-data.
#
# Paste this into the droplet create screen's "user data" box (Advanced
# options → Add Initialization scripts). Set OWYHEE_DEPLOY_EMAIL to your email
# (it receives the claim link and owns the account) — that's the only required edit.
# NO model key goes here: the agent's model routes through the Owyhee proxy.
# Optionally set OWYHEE_MCP_SERVERS (comma-separated server names from your
# Owyhee console), OWYHEE_DEPLOY_TOKEN (if your deployment gates provisioning),
# and OWYHEE_LLM_SERVER / OWYHEE_MODEL to override the default LLM route.
#
# The droplet installs Docker, pulls the public hardened image, and runs it
# with a persistent volume so re-boots reuse the same claimable account. Tool
# AND model traffic are governed by Owyhee; nothing is exposed publicly. After
# it boots, claim your account and connect your LLM provider under Connected
# Services in the console — then the agent can think.

write_files:
  - path: /etc/owyhee/agent.env
    permissions: '0600'
    content: |
      OWYHEE_DEPLOY_EMAIL=you@example.com
      OWYHEE_BASE_URL=https://console.kipplelabs.com
      OWYHEE_MCP_SERVERS=
      OWYHEE_DEPLOY_TOKEN=
      OWYHEE_DEPLOY_REF=digitalocean

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - docker volume create owyhee-data
  - |
    docker run -d --name owyhee-agent --restart unless-stopped \
      --env-file /etc/owyhee/agent.env \
      -v owyhee-data:/data \
      ghcr.io/machinesofdesire/owyhee-openclaw:latest
  - echo "Owyhee agent started. Check your email for the claim link, then claim the account at https://console.kipplelabs.com" > /root/OWYHEE-README.txt
